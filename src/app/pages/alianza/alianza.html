<p-card>
  <ng-template pTemplate="header">
    <div class="flex justify-content-between align-items-center">
      <span>Gestión de Alianzas</span>
    </div>
  </ng-template>

  <div class="p-4">
    <p-table
      [value]="alianzas"
      *ngIf="alianzas.length > 0"
      [loading]="loading"
      [paginator]="true"
      [rows]="5"
      responsiveLayout="scroll"
    >
      <ng-template pTemplate="header">
        <tr>
          <th>ID</th>
          <th>Nombre</th>
          <th>Siglas</th>
          <th>Fecha Creacion</th>
          <th>Activo</th>
        </tr>
      </ng-template>

      <ng-template pTemplate="body" let-alianza let-i="rowIndex">
        <tr>
          <td>{{ i + 1 }}</td>
          <td>{{ alianza.nombre_Alianza }}</td>
          <td>{{ alianza.siglas }}</td>
          <td>{{ alianza.fecha_Create }}</td>
          <td>{{ alianza.flg_Activo }}</td>
        </tr>
      </ng-template>
    </p-table>

    <p *ngIf="!alianzas.length && !loading" class="text-center mt-4">
      No hay resultados.
    </p>
  </div>
</p-card>
