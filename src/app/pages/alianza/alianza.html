<p-card class="alianza-card">
  <ng-template pTemplate="header">
    <div class="alianza-header">
      <span>Gestión de Alianzas</span>
    </div>
  </ng-template>

  <div class="alianza-body">
    <p-table
      [value]="alianzas"
      [loading]="loading"
      [paginator]="true"
      [rows]="5"
      responsiveLayout="scroll"
    >
      <ng-template pTemplate="header">
        <tr>
          <th>ID</th>
          <th>Nombre</th>
          <th>Siglas</th>
          <th>Fecha Creación</th>
          <th>Activo</th>
        </tr>
      </ng-template>

      <ng-template pTemplate="body" let-alianza let-i="rowIndex">
        <tr>
          <td>{{ i + 1 }}</td>
          <td>{{ alianza.nombre_Alianza }}</td>
          <td>{{ alianza.siglas }}</td>
          <td>{{ alianza.fecha_Create | date: 'dd/MM/yyyy' }}</td>
          <td>
            <span
              class="status-pill"
              [ngClass]="alianza.flg_Activo ? 'active' : 'inactive'"
            >
              {{ alianza.flg_Activo ? 'Activo' : 'Inactivo' }}
            </span>
          </td>
        </tr>
      </ng-template>
    </p-table>

    <p *ngIf="!alianzas.length && !loading" class="no-data">
      No hay resultados.
    </p>
  </div>
</p-card>
