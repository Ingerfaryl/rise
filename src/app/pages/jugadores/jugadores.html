<div class="p-4">
  <!-- Formulario de Registro -->
  <p-card header="Registro de Jugadores" class="mb-6">
    <form class="space-y-6">
      <!-- Primera fila -->
      <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
        <div>
          <label for="txtJugadorNombre" class="block text-sm font-medium mb-1">
            Nombre del Jugador
          </label>
          <input pInputText id="txtJugadorNombre" type="text" placeholder="Ingresa el nombre del jugador" class="w-full"
            name="jugadorNombre" [(ngModel)]="jugadorNombre" />
        </div>

        <div>
          <label for="txtJugadorID" class="block text-sm font-medium mb-1">
            ID del Jugador
          </label>
          <input pInputText id="txtJugadorID" type="number" placeholder="Ingresa el ID del jugador" class="w-full"
            name="jugadorId" [(ngModel)]="jugadorId" />
        </div>

        <div>
          <label for="txtJugadorAlianza" class="block text-sm font-medium mb-1">
            Alianza
          </label>

          <p-select id="txtJugadorAlianza" name="alianza" [options]="alianzas" [(ngModel)]="selectedAlianza"
            optionLabel="label" optionValue="value" placeholder="Selecciona una alianza" [filter]="true"
            showClear="true" class="w-full">
          </p-select>

        </div>

      </div>

      <!-- Segunda fila -->
      <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
        <div>
          <label for="txtPoderJugador" class="block text-sm font-medium mb-1">
            Poder del Jugador
          </label>
          <input pInputText id="txtPoderJugador" type="number" placeholder="Ingresa el poder del jugador" class="w-full"
            name="jugadorPoder" [(ngModel)]="jugadorPoder" />
        </div>

        <div>
          <label for="txtKpJugador" class="block text-sm font-medium mb-1">
            KP del Jugador
          </label>
          <input pInputText id="txtKpJugador" type="number" placeholder="Ingresa el KP del jugador" class="w-full"
            name="jugadorKp" [(ngModel)]="jugadorKp" />
        </div>

        <div class="flex items-end">
          <p-button label="Registrar" icon="pi pi-check" styleClass="p-button-secondary w-full"
            (click)="registrarJugador()">
          </p-button>
        </div>
      </div>
    </form>
    <p-toast></p-toast>
  </p-card>

  <div class="table-section">
    <p-card header="Lista de Jugadores" class="shadow-2 border-round-lg">
      <p-toolbar styleClass="mb-4">
        <div class="p-toolbar-group-start">
          <p-button label="Exportar" icon="pi pi-upload" styleClass="p-button-help"></p-button>
        </div>

        <span class="p-input-icon-right">
          <input pInputText type="text" [(ngModel)]="filtro" placeholder="Buscar jugadores..."
            class="w-full sm:w-auto" />
        </span>

      </p-toolbar>

      <!-- 🧾 Tabla de jugadores -->
      <p-table [value]="jugadores" [paginator]="true" [rows]="10" [rowsPerPageOptions]="[5,10,20]"
        [globalFilterFields]="['nombre_Jugador','poder','kp','nombre_Alianza']"
        [filters]="{ global: { value: filtro, matchMode: 'contains' } }" responsiveLayout="scroll"
        class="p-datatable-sm">
        <ng-template pTemplate="header">
          <tr>
            <th>ID</th>
            <th>Nombre</th>
            <th>Poder</th>
            <th>KP</th>
            <th>Alianza</th>
          </tr>
        </ng-template>

        <ng-template pTemplate="body" let-jugador let-i="rowIndex">
          <tr>
            <td>{{ i+1}}</td>
            <td>{{ jugador.nombre_juego }}</td>
            <td>{{ (+jugador.poder) | number:'1.0-0' }}</td>
            <td>{{ (+jugador.kp_inicial) | number:'1.0-0' }}</td>
            <td>{{ jugador.nombre_alianza }}</td>
          </tr>
        </ng-template>
      </p-table>
    </p-card>
  </div>
</div>
