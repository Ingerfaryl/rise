<div class="max-w-9xl mx-auto">
  <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
    <!-- Card KVK -->
    <div class="w-full">
      <p-card header="Registrar KVK" class="shadow-2 border-round-lg h-full">
        <form class="space-y-4">
          <!-- Nombre y Número -->
          <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
            <div>
              <label for="nombreKvk" class="block text-sm font-medium mb-2">Nombre KVK</label>
              <input
                id="nombreKvk"
                pInputText
                [(ngModel)]="kvk.nombre"
                name="nombre"
                class="w-full"
              />
            </div>
            <div>
              <label for="numeroKvk" class="block text-sm font-medium mb-2">Número KVK</label>
              <input
                id="numeroKvk"
                pInputText
                [(ngModel)]="kvk.numero"
                name="numero"
                class="w-full"
                type="number"
              />
            </div>
          </div>

          <!-- Fechas -->
          <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
            <div>
              <label for="fechaInicio" class="block text-sm font-medium mb-2">Fecha Inicio</label>
              <p-date-picker
                [(ngModel)]="kvk.fechaInicio"
                name="fechaInicio"
                dateFormat="yy-mm-dd"
                showIcon
                class="w-full"
              ></p-date-picker>
            </div>
            <div>
              <label for="fechaFin" class="block text-sm font-medium mb-2">Fecha Fin</label>
              <p-date-picker
                [(ngModel)]="kvk.fechaFin"
                name="fechaFin"
                dateFormat="yy-mm-dd"
                showIcon
                class="w-full"
              ></p-date-picker>
            </div>
          </div>

          <!-- Botón -->
          <div class="pt-2">
            <p-button
              label="Registrar"
              (onClick)="registrarKvk()"
              icon="pi pi-save"
              styleClass="p-button-secondary w-full"
            ></p-button>
          </div>
        </form>
      </p-card>
    </div>

    <!-- Card Etapa -->
    <div class="w-full">
      <p-card header="Registrar Etapa" class="shadow-2 border-round-lg h-full">
        <form class="space-y-4">
          <!-- Grid principal -->
          <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
            <!-- Columna 1: KVK y Etapa -->
            <div class="space-y-4">
              <div>
                <label for="kvkSelect" class="block text-sm font-medium mb-2">
                  Selecciona KVK
                </label>
                <p-select
                  id="kvkSelect"
                  name="kvk"
                  [options]="kvks"
                  [(ngModel)]="etapa.kvk"
                  placeholder="Selecciona un KVK"
                  [editable]="true"
                  optionLabel="nombreKvk"
                  optionValue="idKvk"
                  class="w-full"
                />
              </div>
              <div>
                <label for="etapa" class="block text-sm font-medium mb-2">Etapa</label>
                <input
                  id="etapa"
                  pInputText
                  [(ngModel)]="etapa.nombre"
                  name="etapa"
                  class="w-full"
                />
              </div>
            </div>

            <!-- Columna 2: Fechas -->
            <div class="space-y-4">
              <div>
                <label for="fechaInicioEtapa" class="block text-sm font-medium mb-2"
                  >Fecha Inicio</label
                >
                <p-date-picker
                  [(ngModel)]="etapa.fechaInicio"
                  name="fechaInicioEtapa"
                  dateFormat="yy-mm-dd"
                  showIcon
                  class="w-full"
                ></p-date-picker>
              </div>
              <div>
                <label for="fechaFinEtapa" class="block text-sm font-medium mb-2">Fecha Fin</label>
                <p-date-picker
                  [(ngModel)]="etapa.fechaFin"
                  name="fechaFinEtapa"
                  dateFormat="yy-mm-dd"
                  showIcon
                  class="w-full"
                ></p-date-picker>
              </div>
            </div>

            <!-- Columna 3: Descripción -->
            <div>
              <label for="descripcion" class="block text-sm font-medium mb-2">Descripción</label>
              <textarea
                id="descripcion"
                pInputTextarea
                [(ngModel)]="etapa.descripcion"
                name="descripcion"
                rows="4"
                class="w-full resize-none"
              ></textarea>
            </div>
          </div>

          <!-- Botón -->
          <div class="pt-2">
            <p-button
              label="Registrar"
              (onClick)="registrarEtapa()"
              icon="pi pi-save"
              styleClass="p-button-secondary w-full"
            ></p-button>
          </div>
        </form>
      </p-card>
    </div>
  </div>
</div>

<div class="max-w-9xl mx-auto mt-6">
  <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
    <!-- Tabla de KVKs -->
    <div class="w-full">
      <p-card header="Lista de KVKs" class="shadow-2 border-round-lg h-full">
        <p-table
          [value]="kvks"
          [paginator]="true"
          [rows]="5"
          responsiveLayout="scroll"
          styleClass="w-full"
        >
          <ng-template pTemplate="header">
            <tr>
              <th class="text-left">ID</th>
              <th class="text-left">KVK</th>
              <th class="text-left">Fecha Inicio</th>
              <th class="text-left">Fecha Fin</th>
            </tr>
          </ng-template>
          <ng-template pTemplate="body" let-row let-i="rowIndex">
            <tr>
              <td>{{ i + 1 }}</td>
              <td>{{ row.nombreKvk }}</td>
              <td>{{ row.fechaInicio | date : 'dd/MM/yyyy' }}</td>
              <td>{{ row.fechaFin | date : 'dd/MM/yyyy' }}</td>
            </tr>
          </ng-template>
          <ng-template pTemplate="emptymessage">
            <tr>
              <td colspan="4" class="text-center py-4 text-gray-500">No hay KVKs registrados</td>
            </tr>
          </ng-template>
        </p-table>
      </p-card>
    </div>

    <!-- Tabla de Etapas -->
    <div class="w-full">
      <p-card header="Lista de Etapas" class="shadow-2 border-round-lg h-full">
        <p-table
          [value]="etapas"
          [paginator]="true"
          [rows]="5"
          responsiveLayout="scroll"
          styleClass="w-full"
        >
          <ng-template pTemplate="header">
            <tr>
              <th class="text-left">KVK</th>
              <th class="text-left">Etapa</th>
              <th class="text-left">Descripción</th>
            </tr>
          </ng-template>
          <ng-template pTemplate="body" let-row>
            <tr>
              <td>{{ row.kvk?.nombre || 'N/A' }}</td>
              <td>{{ row.nombre }}</td>
              <td class="max-w-xs truncate" [title]="row.descripcion">
                {{ row.descripcion }}
              </td>
            </tr>
          </ng-template>
          <ng-template pTemplate="emptymessage">
            <tr>
              <td colspan="3" class="text-center py-4 text-gray-500">No hay etapas registradas</td>
            </tr>
          </ng-template>
        </p-table>
      </p-card>
    </div>
  </div>
</div>
