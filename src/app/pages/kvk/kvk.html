<div class="flex justify-content-center">
  <div class="col-6 md:col-3">
    <p-card header="Registrar KVK" class="shadow-2 border-round-lg mr-3">
      <form class="p-fluid grid formgrid">
        <!-- Primera fila: Nombre y Número -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
          <div>
            <label for="nombreKvk">Nombre KVK</label>
            <input id="nombreKvk" pInputText [(ngModel)]="kvk.nombre" name="nombre" />
          </div>
          <div>
            <label for="numeroKvk">Número KVK</label>
            <input id="numeroKvk" pInputText [(ngModel)]="kvk.numero" name="numero" />
          </div>
        </div>
        <div class="grid grid-cols-1 md:grid-cols-1 gap-4 mt-3">
          <div>
            <label for="fechaInicio">Fecha Inicio</label>
            <p-date-picker [(ngModel)]="kvk.fechaInicio" name="fechaInicio" dateFormat="yy-mm-dd"
              showIcon></p-date-picker>
          </div>
          <div>
            <label for="fechaFin">Fecha Fin</label>
            <p-date-picker [(ngModel)]="kvk.fechaFin" name="fechaFin" dateFormat="yy-mm-dd" showIcon></p-date-picker>
          </div>

          <!-- Espaciado entre campos y botón -->
          <div class="col-12">
            <div class="mt-3"></div>
          </div>

          <div>
            <p-button label="Registrar" (onClick)="registrarKvk()" icon="pi pi-save"
              styleClass="p-button-success"></p-button>
          </div>

        </div>
      </form>
    </p-card>
  </div>
  <p-card header="Lista de KVKs" class="shadow-2 border-round-lg">
    <p-table [value]="kvks" [paginator]="true" [rows]="5" responsiveLayout="scroll">
      <ng-template pTemplate="header">
        <tr>
          <th>ID</th>
          <th>KVK</th>
          <th>Fecha Inicio</th>
          <th>Fecha Fin</th>
        </tr>
      </ng-template>
      <ng-template pTemplate="body" let-row>
        <tr>
          <td>{{ row.id }}</td>
          <td>{{ row.nombre }}</td>
          <td>{{ row.fechaInicio | date }}</td>
          <td>{{ row.fechaFin | date }}</td>
        </tr>
      </ng-template>
    </p-table>
  </p-card>
</div>
